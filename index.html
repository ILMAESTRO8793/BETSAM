<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123D30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<title>BETSAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#123D30; --felt-deep:#0C2C22; --felt-line:#1F5543;
  --paper:#FAF6EA; --paper-edge:#E9E1C9; --ink:#1C211E; --ink-soft:#5B6259;
  --gold:#D9A520; --gold-ink:#8A6400; --won:#1F7A4A; --lost:#B83227; --void:#6E6E6E;
  --display:"Barlow Condensed", "Arial Narrow", sans-serif;
  --body:"Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--felt);color:var(--paper);font:16px/1.5 var(--body);
  background-image:radial-gradient(circle at 50% -20%, #1A5040 0%, transparent 60%);background-repeat:no-repeat;}
a{color:inherit}
button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--felt-deep);border-bottom:1px solid var(--felt-line)}
.bar{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{font:800 22px/1 var(--display);letter-spacing:.02em;text-decoration:none;margin-right:auto}
.brand small{display:block;font:500 12px/1.2 var(--body);letter-spacing:0;color:#9DBDAF}
nav.tabs{max-width:760px;margin:0 auto;display:flex;gap:4px;padding:0 10px 8px;overflow-x:auto}
nav.tabs a{flex:0 0 auto;text-decoration:none;padding:7px 12px;border-radius:999px;font-weight:600;font-size:15px;color:#C9DDD3}
nav.tabs a[aria-current="page"]{background:var(--paper);color:var(--ink)}
.chip{font:600 13px var(--body);padding:4px 10px;border-radius:999px;border:1px solid var(--felt-line);color:#C9DDD3;white-space:nowrap}
.chip.on{background:var(--won);border-color:var(--won);color:#fff}

main{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font:700 34px/1.05 var(--display);margin:4px 0 6px;letter-spacing:.01em}
h2{font:700 24px/1.1 var(--display);margin:28px 0 10px}
p.lead{color:#C9DDD3;margin:0 0 18px;max-width:60ch}
.muted{color:#9DBDAF}

/* ---------- el ticket ---------- */
.ticket{position:relative;background:var(--paper);color:var(--ink);margin:18px 0 26px;padding:22px 20px 18px;
  --tooth:9px;
  -webkit-mask:radial-gradient(circle var(--tooth) at 50% 0,#0000 98%,#000) 50% 0/calc(var(--tooth)*2.4) 51% repeat-x,
               radial-gradient(circle var(--tooth) at 50% 100%,#0000 98%,#000) 50% 100%/calc(var(--tooth)*2.4) 51% repeat-x;
          mask:radial-gradient(circle var(--tooth) at 50% 0,#0000 98%,#000) 50% 0/calc(var(--tooth)*2.4) 51% repeat-x,
               radial-gradient(circle var(--tooth) at 50% 100%,#0000 98%,#000) 50% 100%/calc(var(--tooth)*2.4) 51% repeat-x;
  filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));}
.t-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.t-title{font:800 26px/1 var(--display);text-transform:none}
.t-date{font:500 14px var(--body);color:var(--ink-soft)}
.stamp{font:800 16px/1 var(--display);padding:6px 10px;border:3px solid currentColor;border-radius:6px;transform:rotate(-6deg);white-space:nowrap}
.stamp.won{color:var(--won)} .stamp.lost{color:var(--lost)} .stamp.void{color:var(--void)} .stamp.pending{color:var(--gold-ink);border-style:dashed}
.leg{display:grid;grid-template-columns:1fr auto;gap:2px 14px;padding:12px 0;border-bottom:1px dashed #B9B19A}
.leg:last-of-type{border-bottom:0}
.leg .meta{font-size:13px;color:var(--ink-soft);grid-column:1/-1}
.leg .match{font-weight:600}
.leg .pick{font:700 20px/1.15 var(--display);color:var(--ink)}
.leg .odds{grid-row:2/4;grid-column:2;align-self:center;font:800 26px/1 var(--display);color:var(--gold-ink)}
.t-total{display:flex;justify-content:space-between;align-items:baseline;border-top:2px solid var(--ink);padding-top:12px;margin-top:4px}
.t-total .lbl{font:600 15px var(--body)}
.t-total .val{font:800 46px/1 var(--display);color:var(--ink)}
.t-total .val small{font:600 18px var(--display);color:var(--ink-soft);margin-left:6px}
.t-text{padding:14px 0 4px;font:600 20px/1.45 var(--body);color:var(--ink);white-space:pre-wrap;word-break:break-word}
.t-notes{margin-top:10px;font-size:15px;color:var(--ink-soft);white-space:pre-wrap}
.t-stake{font-weight:600;color:var(--ink)}
.locked .leg,.locked .t-text{filter:blur(6px);user-select:none;pointer-events:none}
.write{width:100%;min-height:320px;font:500 18px/1.5 var(--body);padding:16px}
.lock-cover{position:absolute;inset:70px 16px 16px;display:grid;place-items:center;text-align:center}
.lock-cover div{background:var(--ink);color:var(--paper);padding:16px 18px;border-radius:10px;max-width:300px}
.lock-cover b{display:block;font:700 22px/1.1 var(--display);margin-bottom:6px}

/* ---------- UI ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;
  font-weight:600;cursor:pointer;text-decoration:none;background:var(--gold);color:#1B1300}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent;color:var(--paper);border:1.5px solid #4F7F6D}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn.small{padding:7px 12px;font-size:14px;border-radius:8px}
.btn.red{background:var(--lost);color:#fff} .btn.green{background:var(--won);color:#fff}
.btn[disabled]{opacity:.55;cursor:wait}
.panel{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:14px;padding:18px;margin:14px 0}
.paper{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px;margin:14px 0}
.paper .muted{color:var(--ink-soft)}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:9px;border:1.5px solid #C9C0A6;background:#fff;color:var(--ink)}
.panel input,.panel select,.panel textarea{border-color:var(--felt-line);background:#0A251D;color:var(--paper)}
textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin:-14px 0 26px}.actions>*{flex:0 0 auto}
.err{background:#4A1410;color:#FFD9D4;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:15px}
.ok{background:#123F28;color:#CFF5DE;border-radius:9px;padding:10px 12px;margin:10px 0;font-size:15px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.plan{background:var(--paper);color:var(--ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:6px}
.plan .price{font:800 48px/1 var(--display)}
.plan .price small{font:600 18px var(--display);color:var(--ink-soft)}
.plan .name{font:700 22px var(--display)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 16px 44px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:30px;height:30px;border-radius:50%;
  background:var(--ink);color:var(--paper);display:grid;place-items:center;font:700 17px var(--display)}
.big-code{font:800 34px/1 var(--display);letter-spacing:.06em;background:#fff;border:2px dashed var(--ink);border-radius:8px;padding:8px 12px;display:inline-block}
.record{display:flex;gap:18px;align-items:baseline;margin:6px 0 4px}
.record b{font:800 40px/1 var(--display)}
.record .w{color:#7FE0A8}.record .l{color:#FF9B90}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--felt-line);vertical-align:top}
th{font-weight:600;color:#9DBDAF;font-size:13px}
.scroll{overflow-x:auto}
.proof{width:64px;height:64px;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--felt-line)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.leg-row{display:grid;grid-template-columns:110px 1fr 1fr 80px 74px 36px;gap:6px;margin-bottom:6px}
@media (max-width:620px){.leg-row{grid-template-columns:1fr 1fr;}.leg-row .x{grid-column:2;justify-self:end}}
.empty{text-align:center;padding:34px 16px;color:#9DBDAF}
.empty b{display:block;font:700 24px var(--display);color:var(--paper);margin-bottom:4px}
.disclaimer{font-size:13px;color:#86A99A;text-align:center;margin-top:36px;max-width:60ch;margin-inline:auto}
dialog{border:0;border-radius:12px;padding:0;max-width:92vw;max-height:88vh;background:#000}
dialog img{display:block;max-width:92vw;max-height:88vh}
dialog::backdrop{background:rgba(0,0,0,.75)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);color:var(--ink);
  padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.35);z-index:50}
@media (prefers-reduced-motion:no-preference){
  .ticket.enter{animation:print .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes print{from{transform:translateY(-14px);clip-path:inset(0 0 100% 0)}to{transform:none;clip-path:inset(0 0 -20px 0)}}
}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="brand" href="#/" id="brand">BETSAM<small>Las jugadas de hoy</small></a>
    <span class="chip" id="subChip" hidden></span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<main id="app" aria-live="polite"></main>
<dialog id="imgDlg"><img alt="Comprobante de pago"></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const money = (n) => '$' + Number(n).toFixed(2).replace(/\.00$/, '');
const state = { user: null, config: null };

async function api(path, opts = {}) {
  const res = await fetch('/api' + path, {
    method: opts.method || 'GET',
    headers: opts.body ? { 'Content-Type': 'application/json' } : {},
    body: opts.body ? JSON.stringify(opts.body) : undefined,
    credentials: 'same-origin',
  });
  let data = {};
  try { data = await res.json(); } catch (_) {}
  if (!res.ok) throw new Error(data.error || 'No se pudo completar. Revisa tu conexión.');
  return data;
}
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function fmtDay(iso) {
  const [y, m, d] = String(iso).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-PA', { weekday: 'long', day: 'numeric', month: 'long' });
}
function fmtDate(ts) {
  return new Date(ts).toLocaleString('es-PA', { timeZone: 'America/Panama', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' });
}
const STAMP = { won: 'Ganado', lost: 'Perdido', void: 'Nulo', pending: 'En juego' };

/* ---- cuotas: acepta americanas (+150 / -110) o decimales (2.50) ---- */
function toDecimal(o) {
  const s = String(o).trim().replace(',', '.');
  if (!s) return null;
  const n = parseFloat(s);
  if (!isFinite(n)) return null;
  if (/^[+-]/.test(s) || Math.abs(n) >= 100) return n > 0 ? 1 + n / 100 : 1 + 100 / Math.abs(n);
  return n > 1 ? n : null;
}
function toAmerican(d) { return d >= 2 ? '+' + Math.round((d - 1) * 100) : '-' + Math.round(100 / (d - 1)); }
function combine(legs) {
  let t = 1;
  for (const l of legs) { const d = toDecimal(l.odds); if (!d) return ''; t *= d; }
  return legs.length ? toAmerican(t) + ' (' + t.toFixed(2) + ')' : '';
}

/* ---------- ticket ---------- */
function ticketHTML(p, { locked = false } = {}) {
  const textOnly = locked ? false : !(p.legs && p.legs.length);
  const n = p.legs_count || 3;
  const legs = locked
    ? Array.from({ length: Math.min(Math.max(n, 2), 6) }, () => ({ sport: 'Deporte', match: 'Equipo local vs Equipo visitante', pick: 'Selección oculta', odds: '+000' }))
    : (p.legs || []);
  const [american, dec] = String(p.total_odds || '').split(' ');
  return `
  <article class="ticket enter ${locked ? 'locked' : ''}">
    <div class="t-head">
      <div><div class="t-title">${esc(p.title)}</div>${p.day ? `<div class="t-date">${esc(fmtDay(p.day))}</div>` : ''}</div>
      <span class="stamp ${esc(p.status)}">${STAMP[p.status] || ''}</span>
    </div>
    ${textOnly ? `<div class="t-text">${esc(p.notes)}</div>` : legs.map((l) => `
      <div class="leg">
        <span class="meta">${esc(l.sport)}${l.time ? ' · ' + esc(l.time) : ''}</span>
        <span class="match">${esc(l.match)}</span>
        <span class="pick">${esc(l.pick)}</span>
        <span class="odds">${esc(l.odds)}</span>
      </div>`).join('')}
    ${!locked && !textOnly && p.total_odds ? `
      <div class="t-total"><span class="lbl">Cuota combinada${p.stake ? `<br><span class="t-stake">${esc(p.stake)}</span>` : ''}</span>
      <span class="val">${esc(american)}${dec ? `<small>${esc(dec)}</small>` : ''}</span></div>` : ''}
    ${!locked && !textOnly && p.notes ? `<div class="t-notes">${esc(p.notes)}</div>` : ''}
    ${locked ? `<div class="lock-cover"><div><b>El parlay de hoy está listo</b>Suscríbete para verlo completo.<br><br><a class="btn" href="#/planes">Ver planes</a></div></div>` : ''}
  </article>`;
}

/* ---------- vistas ---------- */
const views = {
  async hoy(app) {
    const d = await api('/parlays/today');
    let html = `<h1>Jugadas de hoy</h1><p class="lead">${esc(fmtDay(d.day))}. Copia las selecciones y haz tu apuesta en tu casa de apuestas.</p>`;
    if (!d.parlays.length) {
      html += `<div class="empty"><b>Todavía no hay parlay para hoy</b>Lo publicamos antes de los primeros partidos. Vuelve más tarde.</div>`;
    } else {
      html += d.parlays.map((p) => ticketHTML(p, { locked: d.locked })).join('');
    }
    if (d.locked && !state.user) html += `<p class="muted" style="text-align:center">¿Ya pagaste? <a href="#/entrar">Inicia sesión</a></p>`;
    app.innerHTML = html;
  },

  async resultados(app) {
    const d = await api('/parlays/history');
    const total = d.stats.won + d.stats.lost;
    app.innerHTML = `<h1>Resultados</h1>
      <p class="lead">Todos los parlays cerrados de los últimos 45 días, ganados y perdidos.</p>
      <div class="record"><span><b class="w">${d.stats.won}</b> ganados</span><span><b class="l">${d.stats.lost}</b> perdidos</span>
      ${total ? `<span class="muted">${Math.round((d.stats.won / total) * 100)}% de acierto</span>` : ''}</div>
      ${d.parlays.length ? d.parlays.map((p) => ticketHTML(p)).join('') : `<div class="empty"><b>Aún no hay resultados</b>Aquí verás cada parlay cuando termine.</div>`}`;
  },

  async planes(app) {
    const c = state.config;
    const active = state.user?.active && !state.user?.is_admin;
    app.innerHTML = `<h1>Planes</h1>
      <p class="lead">Pagas con Yappy y activamos tu acceso en cuanto confirmamos el pago. Mientras esté activo ves todos los parlays del día.</p>
      ${active ? `<div class="ok">Tu suscripción está activa hasta el ${esc(fmtDate(state.user.sub_until))}. Si pagas otro plan, los días se suman.</div>` : ''}
      <div class="plans">${c.plans.map((p) => `
        <div class="plan">
          <span class="name">${esc(p.name)}</span>
          <span class="price">${money(p.price)}<small> / ${p.days} días</small></span>
          <span class="muted">${p.days >= 28 ? 'El mejor precio por día' : 'Para probar el servicio'}</span>
          <a class="btn dark" style="margin-top:10px" href="#/pagar/${p.id}">Pagar con Yappy</a>
        </div>`).join('')}</div>`;
  },

  async pagar(app, planId) {
    if (!state.user) { location.hash = '#/registro?next=' + encodeURIComponent('/pagar/' + planId); return; }
    const plan = state.config.plans.find((p) => String(p.id) === String(planId));
    if (!plan) { location.hash = '#/planes'; return; }
    const { payments } = await api('/payments/mine');
    const pending = payments.find((p) => p.status === 'pending');
    const y = state.config.yappy;
    if (pending) { app.innerHTML = pendingHTML(pending); return; }
    const ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // sin O/0 ni I/1 para evitar confusiones
    const ref = 'BS' + Array.from({ length: 5 }, () => ABC[Math.floor(Math.random() * ABC.length)]).join('');
    app.innerHTML = `<h1>Pagar ${esc(plan.name)}</h1>
      <p class="lead">${money(plan.price)} por ${plan.days} días de acceso.</p>
      <div class="paper">
        <ol class="steps">
          <li>Abre <b>Yappy</b> y envía <b>${money(plan.price)}</b> a
            ${y.handle ? `<b>${esc(y.handle)}</b> (Directorio)` : ''}${y.handle && y.phone ? ' o al ' : ''}${y.phone ? `<b>${esc(y.phone)}</b>` : ''}${!y.handle && !y.phone ? '<i>el número que te indicamos por WhatsApp</i>' : ''}${y.name ? `, a nombre de <b>${esc(y.name)}</b>` : ''}.</li>
          <li>En el mensaje del pago escribe este código:<br><span class="big-code">${ref}</span></li>
          <li>Yappy te muestra un número de confirmación. Escríbelo abajo y sube la captura del pago.</li>
        </ol>
      </div>
      <form id="payForm" class="panel">
        <label for="tx">Número de confirmación de Yappy</label>
        <input id="tx" required autocomplete="off" placeholder="Ej. 4F7K2X9Q">
        <label for="proof">Captura del pago (recomendado)</label>
        <input id="proof" type="file" accept="image/*">
        <div id="payErr"></div>
        <button class="btn" style="margin-top:14px;width:100%">Enviar pago para revisión</button>
      </form>`;
    $('#payForm').onsubmit = async (e) => {
      e.preventDefault();
      const btn = e.target.querySelector('button'); btn.disabled = true; $('#payErr').innerHTML = '';
      try {
        const file = $('#proof').files[0];
        const proof = file ? await compressImage(file) : null;
        const { payment } = await api('/payments', { method: 'POST', body: { plan_id: plan.id, yappy_tx: $('#tx').value, proof, ref_code: ref } });
        app.innerHTML = pendingHTML({ ...payment, plan_name: plan.name, amount: plan.price, yappy_tx: $('#tx')?.value });
      } catch (err) { $('#payErr').innerHTML = `<div class="err">${esc(err.message)}</div>`; btn.disabled = false; }
    };
  },

  async cuenta(app) {
    if (!state.user) { location.hash = '#/entrar'; return; }
    const { payments } = await api('/payments/mine');
    const u = state.user;
    app.innerHTML = `<h1>Mi cuenta</h1>
      <div class="panel">
        <div style="font-weight:600;font-size:18px">${esc(u.name)}</div>
        <div class="muted">${esc(u.phone)}</div>
        <p>${u.is_admin ? 'Eres administrador.' : u.active ? `Suscripción activa hasta el <b>${esc(fmtDate(u.sub_until))}</b>.` : 'No tienes una suscripción activa.'}</p>
        ${!u.is_admin ? `<a class="btn" href="#/planes">${u.active ? 'Añadir más días' : 'Suscribirme'}</a>` : ''}
      </div>
      <h2>Mis pagos</h2>
      ${payments.length ? `<div class="scroll"><table><thead><tr><th>Fecha</th><th>Plan</th><th>Monto</th><th>Estado</th></tr></thead><tbody>
        ${payments.map((p) => `<tr><td>${esc(fmtDate(p.created_at))}</td><td>${esc(p.plan_name)}</td><td>${money(p.amount)}</td>
        <td>${{ pending: 'En revisión', approved: 'Aprobado', rejected: 'Rechazado' }[p.status]}${p.note ? `<br><span class="muted">${esc(p.note)}</span>` : ''}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">Aún no has hecho pagos.</p>'}
      <button class="btn ghost" id="logout" style="margin-top:24px">Cerrar sesión</button>`;
    $('#logout').onclick = async () => { await api('/logout', { method: 'POST' }); state.user = null; location.hash = '#/'; render(); };
  },

  entrar(app) { authForm(app, 'login'); },
  registro(app) { authForm(app, 'register'); },

  async admin(app, sub = 'parlays') {
    if (!state.user?.is_admin) { location.hash = '#/'; return; }
    const s = await api('/admin/summary');

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const max = 1100, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = () => reject(new Error('No se pudo leer la imagen. Prueba con otra captura.'));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- navegación ---------- */
function drawChrome(route) {
  const u = state.user;
  const items = [['/', 'Hoy'], ['/resultados', 'Resultados'], ['/planes', 'Planes']];
  if (u) items.push(['/cuenta', 'Mi cuenta']); else items.push(['/entrar', 'Entrar']);
  if (u?.is_admin) items.push(['/admin', 'Panel']);
  $('#tabs').innerHTML = items.map(([h, l]) => `<a href="#${h}" ${('/' + route) === h || (h === '/' && route === '') ? 'aria-current="page"' : ''}>${l}</a>`).join('');
  const chip = $('#subChip');
  if (u && !u.is_admin) { chip.hidden = false; chip.textContent = u.active ? 'Suscripción activa' : 'Sin suscripción'; chip.classList.toggle('on', u.active); }
  else chip.hidden = true;
  const name = state.config?.app_name || 'BETSAM';
  $('#brand').firstChild.textContent = name; document.title = name;
}

async function render() {
  const app = $('#app');
  const [route, ...args] = location.hash.replace(/^#\/?/, '').split('?')[0].split('/');
  try {
    const [me] = await Promise.all([api('/me'), state.config ? null : api('/config').then((c) => (state.config = c))]);
    state.user = me.user;
    drawChrome(route);
    const view = { '': 'hoy', resultados: 'resultados', planes: 'planes', pagar: 'pagar', cuenta: 'cuenta', entrar: 'entrar', registro: 'registro', admin: 'admin' }[route] || 'hoy';
    await views[view](app, ...args);
    if (state.config?.disclaimer && view !== 'admin') app.insertAdjacentHTML('beforeend', `<p class="disclaimer">${esc(state.config.disclaimer)}</p>`);
  } catch (err) {
    app.innerHTML = `<div class="err">${esc(err.message)}</div><button class="btn" onclick="render()">Reintentar</button>`;
  }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
$('#imgDlg').addEventListener('click', (e) => e.currentTarget.close());
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
